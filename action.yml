name: Lode Integration Guard
description: Shows source-linked facts from Lode when a pull request adds or removes an integration. Reads 9 config files only.
author: Lode (trylode.io)
branding:
  icon: shield
  color: gray-dark
inputs:
  dirs:
    description: Folders to check, comma-separated (for monorepos), relative to the repository root.
    required: false
    default: "."
  comment:
    description: Post or update one pull request comment with the result (needs pull-requests write). The result always goes to the job summary.
    required: false
    default: "true"
  github-token:
    description: Token used only to post the comment.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Lode Integration Guard
      shell: bash
      env:
        INPUT_DIRS: ${{ inputs.dirs }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"
